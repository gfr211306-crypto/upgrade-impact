[project]
name = "upgrade-impact"
version = "0.1.0"
description = "Find dependency upgrade breakages in your Python code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "gfr211306-crypto", email = "gfr211306@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "griffe[pypi]>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/gfr211306-crypto/upgrade-impact"
Issues = "https://github.com/gfr211306-crypto/upgrade-impact/issues"

[project.scripts]
upgrade-impact = "upgrade_impact.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
